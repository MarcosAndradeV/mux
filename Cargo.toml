[workspace]

members = [
    "muxui",
    "muxapp",
    "muxutils", "muxtest",
]

resolver = "3"

[workspace.dependencies]
raylib = { git = "https://github.com/MarcosAndradeV/raylib-rs", version = "0.1.0" }
gss = { git = "https://github.com/MarcosAndradeV/GSS", version = "0.1.0", features = ["interning"] }
notify = "8.2.0"

[workspace.package]
version = "0.4.0"
edition = "2024"
